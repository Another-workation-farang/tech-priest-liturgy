name: anoint

on:
  push:
  pull_request:

jobs:
  anoint:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -e ".[anoint]" pytest
      - run: python -m pytest tests/test_rubric.py tests/test_unction.py tests/test_anoint.py -v -rs
        env:
          LITURGY_REQUIRE_NUITKA: "1"
